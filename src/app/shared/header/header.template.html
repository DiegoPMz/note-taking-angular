<header
	class="navbar bg-base-300 px-[16px] py-[12px] md:px-[32px] md:py-[16px] 2xl:bg-transparent sticky top-0 z-40">
	<button class="w-fit h-fit 2xl:hidden">
		<app-icon-logo />
	</button>

	<div class="hidden 2xl:flex justify-between items-center w-full">
		<h1 class="font-bold text-[24px] text-base-content">
			{{ headerTitle }}
		</h1>

		<div class="flex items-center gap-[12px]">
			<div class="w-[300px]">
				<ng-content select="[header-input]" />
			</div>

			<button type="button" class="btn btn-ghost btn-circle">
				<app-icon-settings />
			</button>
		</div>
	</div>

	<div
		class="hidden 2xl:divider 2xl:h-[1px] 2xl:p-0 2xl:m-0 2xl:w-full 2xl:absolute 2xl:bottom-0 2xl:left-0"></div>
</header>
