<ul class="menu menu-vertical rounded-none w-full h-full px-0">
	<ng-container *ngIf="tags$ | async as tags; else elseEmptyTags">
		<ng-container *ngFor="let tag of tags">
			<li>
				<button
					class="py-3"
					type="button"
					routerLink
					[queryParams]="{ tag: tag.name }"
					queryParamsHandling="merge">
					<svg
						class="w-5 h-5"
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						fill="none"
						viewBox="0 0 24 24">
						<path
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="1.8"
							d="M3.016 5.966c.003-1.411 1.07-2.677 2.456-2.916.284-.05 3.616-.042 4.995-.041 1.364 0 2.527.491 3.49 1.452 2.045 2.042 4.088 4.085 6.128 6.13 1.208 1.21 1.224 3.066.022 4.28a805.496 805.496 0 0 1-5.229 5.228c-1.212 1.201-3.069 1.186-4.279-.022-2.064-2.058-4.127-4.115-6.182-6.182-.795-.8-1.264-1.766-1.368-2.895-.084-.903-.035-4.26-.033-5.034Z"
							clip-rule="evenodd" />
						<path
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="1.8"
							d="M9.907 8.315a1.607 1.607 0 0 1-1.61 1.583c-.872-.002-1.599-.73-1.594-1.596a1.604 1.604 0 0 1 1.633-1.607c.864.003 1.575.736 1.571 1.62Z"
							clip-rule="evenodd" />
					</svg>
					{{ tag.name }}
				</button>
				<div class="divider h-[0px] m-0 py-0 px-2 pointer-events-none"></div>
			</li>
		</ng-container>
	</ng-container>

	<ng-template #elseEmptyTags>
		<span class="z-10 bg-base-300 text-base-content rounded-lg p-2 text-pretty">
			No tags available. Create a new note to organize your thoughts with tags.
		</span>
	</ng-template>
</ul>
