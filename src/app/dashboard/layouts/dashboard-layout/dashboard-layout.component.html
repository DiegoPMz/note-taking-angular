<app-sidebar [tagCollection$]="userTags$">
	<!-- MOBILE LAYOUT -->
	<div class="!h-full flex flex-col 2xl:hidden">
		<div class="sticky top-0 z-40">
			<app-header>
				<app-notes-search-input />
			</app-header>
		</div>

		<div class="!flex-grow pb-12 2xl:hidden">
			<app-mobile-note-details
				*ngIf="shouldDisplayNoteDetails$ | async; else noteSelectedNote" />

			<ng-template #noteSelectedNote>
				<ng-content />
			</ng-template>

			<app-bottom-navigation />
		</div>
	</div>

	<app-desktop-dashboard-view />
</app-sidebar>
