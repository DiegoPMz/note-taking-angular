<app-section-page-mobile>
	<div class="flex flex-col py-4 gap-4" page-title>
		<h1 class="text-2xl font-bold">Search</h1>

		<app-notes-search-input />
		<span class="text-sm">
			<ng-container
				*ngIf="searchQuery$ | async as searchQuery; else emptySearchValue">
				All notes matching
				<span class="font-bold"> ”{{ searchQuery }}” </span>
				are displayed below.
			</ng-container>

			<ng-template #emptySearchValue>
				Enter a keyword to start searching through your notes.
			</ng-template>
		</span>
	</div>

	<app-sidebar-notes
		page-content
		[notes$]="filteredNotesBySearchQuery$"
		[errorState$]="invalidFilteredNotesSearchSection$" />
</app-section-page-mobile>
